# Runs the test suite on every push and pull request. Tests use recorded model responses
# (a fake Anthropic client) and the kill switch, so no API key is needed and nothing is spent.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run pytest -q
