# Fallback for the Claude Routine (docs/routine.md): writes reports/<day>.md from the data
# branch's exports/daily_summary.json and commits only that file to main.
# Use the Routine if your plan has Routines; otherwise uncomment the schedule below.
name: daily-report

on:
  workflow_dispatch:
    inputs:
      kill_switch:
        description: "Write the plain report without a model call"
        type: boolean
        default: false
  # schedule:
  #   - cron: "0 12 * * *"   # 12:00 UTC every day

permissions:
  contents: write

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
      FAREWATCH_KILL_SWITCH: ${{ inputs.kill_switch && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the daily summary from the data branch
        run: |
          git fetch origin data
          git show FETCH_HEAD:exports/daily_summary.json > "$RUNNER_TEMP/summary.json"

      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen

      - name: Write the report
        run: uv run python scripts/daily_report.py --summary "$RUNNER_TEMP/summary.json"

      - name: Commit only the report
        run: |
          git config --global user.name "report-bot"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && { echo "report unchanged"; exit 0; }
          git commit -q -m "report: daily summary"
          git push -q origin HEAD:main
