[project]
name = "fare-watch"
version = "0.1.0"
description = "Governed data agent that tracks simulated Chicago to Cancun nonstop fares."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.17.0",
    "apscheduler==3.11.3",
    "faker==40.43.0",
    "matplotlib>=3.11.2",
    "numpy==2.5.4",
    "pydantic==2.14.1",
    "python-dotenv>=1.2.4",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "tinydb==4.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]
